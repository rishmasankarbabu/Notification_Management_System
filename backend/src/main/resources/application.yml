spring:
  application:
    name: notification-board-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_board
    username: admin
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:}
    password: ${ARTEMIS_PASSWORD:}

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  messaging:
    queue: alert.notifications
  security:
    username: ${APP_AUTH_USERNAME:operator}
    password: ${APP_AUTH_PASSWORD}
  cors:
    allowed-origin: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
